<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>P3M Viewer</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    font-family: Arial, sans-serif;
}

#map {
    width:100%;
    height:100%;
}

/* Rodapé de créditos */
#credits {
    position:absolute;
    bottom:5px;
    left:50%;
    transform:translateX(-50%);
    z-index:1000;

    background:rgba(255,255,255,0.9);
    padding:6px 10px;

    border-radius:6px;
    font-size:11px;

    box-shadow:0 1px 4px rgba(0,0,0,0.2);
}

#credits a{
    color:#0066cc;
    text-decoration:none;
}

#credits a:hover{
    text-decoration:underline;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="credits">
    Dados geográficos:
    <a href="https://p3mgeo.sgb.gov.br/" target="_blank">
    P3M/SGB
</a>
    • Base cartográfica:
    <a href="https://www.openstreetmap.org/" target="_blank">
        OpenStreetMap
    </a>
    • Visualização:
    <a href="https://leafletjs.com/" target="_blank">
        Leaflet
    </a>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const params = new URLSearchParams(window.location.search);

const processo = (params.get("processo") || "")
    .trim()
    .replace(/\s+/g,'');

const map = L.map('map').setView([-15,-55],4);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'© OpenStreetMap'
}).addTo(map);

const url = new URL("https://opendata.sgb.gov.br/geoserver/p3m/ows");

url.searchParams.set("service", "WFS");
url.searchParams.set("version", "1.0.0");
url.searchParams.set("request", "GetFeature");
url.searchParams.set("typeName", "p3m:mvw_processos_minerarios_ativos");
url.searchParams.set("outputFormat", "application/json");
url.searchParams.set("CQL_FILTER", `ds_processo='${processo}'`);

fetch(url)
.then(r => r.json())
.then(data => {

    const layer = L.geoJSON(data,{
        style:{
            color:'#ff0000',
            weight:3
        },

        onEachFeature:(feature,layer)=>{

            const p = feature.properties;

            layer.bindPopup(`
                <b>Processo:</b> ${p.ds_processo}<br>
                <b>Substância:</b> ${p.nm_substancia}<br>
                <b>Empresa:</b> ${p.nm_pessoa}<br>
                <b>Fase:</b> ${p.ds_fase_processo}<br>
                <b>Município:</b> ${p.nm_mun}/${p.sigla_uf}<br>
                <b>Área:</b> ${p.qt_area} ha
            `);
        }
    }).addTo(map);

    map.fitBounds(layer.getBounds());

})
.catch(err => {
    console.error(err);

    alert("Erro ao carregar dados do processo.");
});

</script>

</body>
</html>
